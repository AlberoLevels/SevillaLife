<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevillalife</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #faf9f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Logo centrado en el espacio superior exterior */
        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
            width: 100%;
        }

        .game-logo {
            max-width: 160px;
            height: auto;
            object-fit: contain;
            display: block;
        }

        /* Tarjeta principal con la línea superior Albero */
        .form-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            border-top: 6px solid #e08b28; /* Línea color Albero */
            text-align: center;
        }

        .form-card h1 {
            color: #d32f2f;
            font-size: 2.1rem;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .subtitle {
            color: #757575;
            font-size: 0.88rem;
            margin-bottom: 4px;
        }

        .disclaimer {
            color: #9e9e9e;
            font-size: 0.8rem;
            font-style: italic;
            margin-bottom: 20px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #424242;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #424242;
            outline: none;
            background-color: #fff;
        }

        .form-group input:focus {
            border-color: #d32f2f;
        }

        .btn-primary {
            width: 100%;
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            margin-bottom: 10px;
        }

        .btn-secondary {
            width: 100%;
            background-color: transparent;
            color: #d32f2f;
            border: 1px solid #d32f2f;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: bold;
            cursor: pointer;
        }

        footer {
            margin-top: 20px;
            color: #9e9e9e;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <!-- Logo posicionado en el espacio blanco superior -->
    <div class="logo-container">
        <img src="logo.png" alt="Logo AlberoLevels" class="game-logo">
    </div>

    <!-- Formulario contenido en la tarjeta -->
    <div class="form-card">
        <h1>Sevillalife</h1>
        <p class="subtitle">Registro oficial de identidad y alta en el padrón municipal.</p>
        <p class="disclaimer">* Se recomienda no usar datos ni nombres reales.</p>

        <form id="registerForm">
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" value="Curro" required>
            </div>

            <div class="form-group">
                <label for="apellido1">Primer Apellido</label>
                <input type="text" id="apellido1" value="García" required>
            </div>

            <div class="form-group">
                <label for="apellido2">Segundo Apellido</label>
                <input type="text" id="apellido2" value="Sevillano" required>
            </div>

            <button type="submit" class="btn-primary">Comenzar mi historia</button>
            <button type="button" class="btn-secondary">Gestión de Partida (Guardar / Cargar)</button>
        </form>
    </div>

    <footer>
        © 2026 AlberoLevels.
    </footer>

</body>
</html>
