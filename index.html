<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Modal Nombra a tu Mascota</title>

  <style>
    /* Estilos base del juego */
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: #0f0f1a url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1200') no-repeat center/cover;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Fondo oscuro traslúcido (Overlay con blur) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 7, 18, 0.75);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.3s ease-out;
    }

    /* Ventana Principal del Juego */
    .game-modal {
      position: relative;
      width: 420px;
      background: linear-gradient(145deg, #181528, #0e0c19);
      border: 2px solid #5a4b87;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.8),
                  0 0 20px rgba(120, 80, 220, 0.25),
                  inset 0 1px 1px rgba(255, 255, 255, 0.1);
      text-align: center;
      color: #e2e1f0;
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Bordes/Esquinas decorativas estilo interfaz de juego */
    .game-modal::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 18px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      pointer-events: none;
    }

    /* Cabecera / Título */
    .modal-title {
      margin: 0 0 16px 0;
      font-size: 1.4rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #f3e5ab;
      text-shadow: 0 2px 8px rgba(255, 215, 0, 0.3);
    }

    /* Marco del Avatar de la Mascota */
    .pet-avatar-container {
      position: relative;
      width: 96px;
      height: 96px;
      margin: 0 auto 20px auto;
      border-radius: 50%;
      background: radial-gradient(circle, #312658 0%, #151128 100%);
      border: 3px solid #ffcc00;
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.4), inset 0 0 10px #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pet-avatar-icon {
      font-size: 48px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    }

    .modal-subtitle {
      font-size: 0.9rem;
      color: #a099c2;
      margin-bottom: 18px;
    }

    /* Campo de Entrada de Texto */
    .input-wrapper {
      position: relative;
      margin-bottom: 24px;
    }

    .game-input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 40px 12px 16px;
      background: rgba(12, 10, 22, 0.85);
      border: 1.5px solid #4a3e72;
      border-radius: 8px;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 600;
      outline: none;
      transition: all 0.25s ease;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5);
    }

    .game-input:focus {
      border-color: #ffcc00;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.5), 0 0 10px rgba(255, 204, 0, 0.3);
    }

    .game-input::placeholder {
      color: #5c557c;
      font-weight: 400;
    }

    /* Contador de Caracteres */
    .char-counter {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.75rem;
      color: #6d6494;
    }

    /* Botones de Acción */
    .button-group {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      flex: 1;
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .btn-secondary {
      background: #2a2442;
      color: #a9a2c9;
      border: 1px solid #453c66;
    }

    .btn-secondary:hover {
      background: #373056;
      color: #ffffff;
    }

    .btn-primary {
      background: linear-gradient(180deg, #ffcc00 0%, #d49b00 100%);
      color: #1a1200;
      border: 1px solid #ffe169;
      box-shadow: 0 4px 12px rgba(212, 155, 0, 0.35);
    }

    .btn-primary:hover {
      filter: brightness(1.15);
      box-shadow: 0 6px 16px rgba(255, 204, 0, 0.5);
    }

    .btn:active {
      transform: scale(0.96);
    }

    /* Animaciones UI */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.85) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Modal Emergente del Juego -->
  <div class="modal-overlay">
    <div class="game-modal">
      <h2 class="modal-title">Nombra a tu Compañero</h2>

      <div class="pet-avatar-container">
        <span class="pet-avatar-icon">🐱</span>
      </div>

      <div class="modal-subtitle">¿Cómo se llamará tu fiel amigo?</div>

      <div class="input-wrapper">
        <input 
          type="text" 
          class="game-input" 
          id="petName" 
          maxlength="12" 
          placeholder="Escribe un nombre..."
          value="Dante"
          autocomplete="off"
        >
        <span class="char-counter" id="counter">5/12</span>
      </div>

      <div class="button-group">
        <button class="btn btn-secondary" onclick="randomName()">Aleatorio</button>
        <button class="btn btn-primary" onclick="confirmName()">Confirmar</button>
      </div>
    </div>
  </div>

  <script>
    const input = document.getElementById('petName');
    const counter = document.getElementById('counter');
    const names = ["Dante", "Sombra", "Orion", "Zeus", "Nix", "Astra"];

    input.addEventListener('input', () => {
      counter.textContent = `${input.value.length}/12`;
    });

    function randomName() {
      const random = names[Math.floor(Math.random() * names.length)];
      input.value = random;
      counter.textContent = `${input.value.length}/12`;
    }

    function confirmName() {
      if(input.value.trim() !== '') {
        alert(`¡Tu mascota ahora se llama ${input.value}!`);
      }
    }
  </script>
</body>
</html>
