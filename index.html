<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevillalife</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
        }

        /* Contenedor del logo compacto fuera de la tarjeta */
        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 380px;
            margin-bottom: 8px;
        }

        .game-logo {
            width: 180px;
            max-height: 75px;
            object-fit: contain;
            display: block;
        }

        /* Tarjeta principal ajustada para evitar scroll */
        .form-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 16px 18px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            border-top: 5px solid #e08b28; /* Línea color Albero */
            border-left: 1px solid #f0f0f0;
            border-right: 1px solid #f0f0f0;
            border-bottom: 1px solid #f0f0f0;
            text-align: center;
        }

        .form-card h1 {
            color: #d32f2f;
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 2px;
            line-height: 1.1;
        }

        .subtitle {
            color: #757575;
            font-size: 0.8rem;
            margin-bottom: 2px;
        }

        .disclaimer {
            color: #9e9e9e;
            font-size: 0.72rem;
            font-style: italic;
            margin-bottom: 12px;
        }

        /* Contenedor de mensaje de error */
        .error-message {
            display: none;
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: #424242;
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 0.88rem;
            color: #424242;
            outline: none;
            background-color: #fff;
        }

        .form-group input:focus {
            border-color: #d32f2f;
        }

        .btn-primary {
            width: 100%;
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.88rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 4px;
            margin-bottom: 8px;
        }

        .btn-secondary {
            width: 100%;
            background-color: transparent;
            color: #d32f2f;
            border: 1px solid #d32f2f;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: bold;
            cursor: pointer;
        }

        footer {
            margin-top: 10px;
            color: #9e9e9e;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>

    <!-- Logo compacto encima de la línea Albero -->
    <div class="logo-container">
        <img src="logo.png" alt="Logo AlberoLevels" class="game-logo">
    </div>

    <!-- Formulario principal -->
    <div class="form-card">
        <h1>Sevillalife</h1>
        <p class="subtitle">Registro oficial de identidad y alta en el padrón municipal.</p>
        <p class="disclaimer">* Se recomienda no usar datos ni nombres reales.</p>

        <!-- Cuadro de error si faltan datos -->
        <div id="errorMessage" class="error-message"></div>

        <form id="registerForm" novalidate>
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" value="Curro">
            </div>

            <div class="form-group">
                <label for="apellido1">Primer Apellido</label>
                <input type="text" id="apellido1" value="García">
            </div>

            <div class="form-group">
                <label for="apellido2">Segundo Apellido</label>
                <input type="text" id="apellido2" value="Sevillano">
            </div>

            <button type="submit" class="btn-primary">Comenzar mi historia</button>
            <button type="button" class="btn-secondary">Gestión de Partida (Guardar / Cargar)</button>
        </form>
    </div>

    <footer>
        © 2026 AlberoLevels.
    </footer>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Evita que la página se recargue

            const nombre = document.getElementById('nombre').value.trim();
            const apellido1 = document.getElementById('apellido1').value.trim();
            const apellido2 = document.getElementById('apellido2').value.trim();
            const errorBox = document.getElementById('errorMessage');

            // Comprueba si falta algún campo por rellenar
            if (!nombre || !apellido1 || !apellido2) {
                errorBox.textContent = 'Por favor, rellena todos los campos antes de comenzar.';
                errorBox.style.display = 'block';
            } else {
                errorBox.style.display = 'none';
                // Aquí inicia el juego o redirige a la siguiente pantalla
                alert('¡Registro correcto! Iniciando la historia...');
            }
        });
    </script>

</body>
</html>
