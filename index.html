<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SevillaLife</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 { color: #d9534f; }
        .stats {
            display: flex;
            justify-content: space-between;
            background: #e9ecef;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 0.9em;
        }
        .actions {
            margin-bottom: 20px;
        }
        button {
            padding: 10px 15px;
            margin-right: 5px;
            margin-bottom: 5px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #log {
            background: #212529;
            color: #00ff00;
            padding: 15px;
            height: 180px;
            overflow-y: auto;
            font-family: monospace;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>SevillaLife 🎮 (Saga Familiar)</h1>

    <!-- Panel de Estadísticas -->
    <div class="stats">
        <div>Edad: <span id="stat-age">0</span></div>
        <div>Salud: <span id="stat-health">100</span>%</div>
        <div>Felicidad: <span id="stat-happiness">100</span>%</div>
        <div>Dinero: <span id="stat-money">0</span>€</div>
        <div>Estado: <span id="stat-job">Bebé</span></div>
    </div>

    <!-- Panel de Botones de Acción -->
    <div class="actions">
        <button onclick="nextYear()">Cumplir Año</button>
        <button id="btn-job" onclick="buscarTrabajo()" disabled>Buscar Trabajo (Req: 16 años)</button>
        <button id="btn-study" onclick="estudiar()">Estudiar / Colegio</button>
    </div>

    <!-- Consola de Eventos -->
    <h3>Registro de Eventos:</h3>
    <div id="log"></div>
    
    <p style="margin-top: 30px; font-size: 0.8em; color: #777; text-align: center;">Desarrollado por Curro • © AlberoLevels</p>

    <script>
        // 1. Objeto Jugador base
        let player = {
            name: "Curro",
            age: 0,
            health: 100,
            happiness: 100,
            money: 0,
            job: "Bebé",
            educationLevel: "Ninguna", 
            isStudying: false,
            partner: null,
            children: []
        };

        // 2. Listado de trabajos
        const trabajosSevilla = [
            { title: "Repartidor en bicicleta", reqEducation: "ESO", salary: 12000 },
            { title: "Reponedor en Triana", reqEducation: "ESO", salary: 14000 },
            { title: "Camarero en la Alameda", reqEducation: "ESO", salary: 15000 },
            { title: "Dependiente en calle Sierpes", reqEducation: "ESO", salary: 16500 },
            { title: "Operario en Lipasam", reqEducation: "ESO", salary: 22000 },
            { title: "Técnico de Mantenimiento", reqEducation: "FP", salary: 24000 },
            { title: "Administrativo de Oficina", reqEducation: "FP", salary: 23000 },
            { title: "Abogado en Nervión", reqEducation: "Universidad", salary: 45000 },
            { title: "Médico en el Virgen del Rocío", reqEducation: "Universidad", salary: 50000 }
        ];

        function addLog(text) {
            let logDiv = document.getElementById("log");
            logDiv.innerHTML += `> ${text}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateUI() {
            document.getElementById("stat-age").innerText = player.age;
            document.getElementById("stat-health").innerText = player.health;
            document.getElementById("stat-happiness").innerText = player.happiness;
            document.getElementById("stat-money").innerText = player.money;
            document.getElementById("stat-job").innerText = player.job;

            let btnJob = document.getElementById("btn-job");
            let btnStudy = document.getElementById("btn-study");

            if (player.age < 16) {
                btnJob.disabled = true;
                btnJob.innerText = `Buscar Trabajo (Req: 16 años)`;
                if (player.age < 6) {
                    btnStudy.disabled = true;
                    btnStudy.innerText = `Demasiado pequeño para el cole`;
                } else {
                    btnStudy.disabled = false;
                    btnStudy.innerText = player.isStudying ? "Dejar el Colegio" : "Estudiar en el Cole";
                }
            } else {
                btnJob.disabled = false;
                btnJob.innerText = `Buscar Trabajo`;
                btnStudy.innerText = player.isStudying ? "Dejar Estudios" : "Estudiar (FP/Univ)";
            }
        }

        // 3. Eventos de Decisión en la Niñez
        function dispararEventoDecisionInfancia() {
            let opcionesDecision = [
                {
                    edadCritica: 8,
                    pregunta: "Con 8 años, tus amigos te invitan a apuntarte al equipo de fútbol del barrio o a quedarte en casa jugando a la consola. ¿Qué haces?",
                    opcionA: "Ir a jugar al fútbol (+Salud, +Felicidad)",
                    opcionB: "Quedarte en casa viciando (+Felicidad, -Salud)",
                    accionA: () => { player.health += 5; player.happiness += 10; addLog("[Decisión] Te uniste al equipo del barrio. ¡Estás hecho un atleta!"); },
                    accionB: () => { player.happiness += 15; player.health -= 5; addLog("[Decisión] Tarde entera de vicio. Te lo pasaste teta pero te moviste poco."); }
                },
                {
                    edadCritica: 12,
                    pregunta: "Con 12 años, encuentras una cartera perdida en la calle con 50€ dentro. ¿Qué haces?",
                    opcionA: "Llevarla a la policía / buscar al dueño (+Felicidad, +Karma)",
                    opcionB: "Quedarte con el dinero (+Dinero, -Felicidad por remordimientos)",
                    accionA: () => { player.happiness += 10; addLog("[Decisión] Devolviste la cartera. Te sientes una bellísima persona."); },
                    accionB: () => { player.money += 50; player.happiness -= 5; addLog("[Decisión] Te pillaste chuches y cómics con los 50€ ajenos. Mal rollo en la conciencia."); }
                },
                {
                    edadCritica: 14,
                    pregunta: "Con 14 años, se acercan los exámenes clave. ¿Te matas a estudiar o pasas olímpicamente?",
                    opcionA: "Estudiar duro (Facilita el futuro académico)",
                    opcionB: "Pasar y irse de botellón/parque con los colegas",
                    accionA: () => { player.happiness -= 5; player.educationLevel = "ESO_BUENA"; addLog("[Decisión] Sacaste un curso excelente a base de codos."); },
                    accionB: () => { player.happiness += 10; player.health -= 5; addLog("[Decisão] Pasaste de estudiar y te fuiste de risas por el barrio."); }
                }
            ];

            // Buscar si hay un evento para la edad actual
            let eventoActual = opcionesDecision.find(e => e.edadCritica === player.age);
            if (eventoActual) {
                let respuesta = confirm(eventoActual.pregunta + "\n\n[Aceptar] = Opción 1\n[Cancelar] = Opción 2");
                if (respuesta) {
                    eventoActual.accionA();
                } else {
                    eventoActual.accionB();
                }
            } else {
                // Eventos aleatorios normales si no hay dilema de edad fija
                let eventosAleatorios = [
                    { texto: "Te caíste patinando por el Paseo de Colón.", salud: -5, felicidad: -5 },
                    { texto: "Tus abuelos te dieron una propina sorpresa en Navidad.", dinero: 15, felicidad: 10 },
                    { texto: "Tarde de merendola con churros en la campana.", salud: 2, felicidad: 10 }
                ];
                let ev = eventosAleatorios[Math.floor(Math.random() * eventosAleatorios.length)];
                addLog(`[Infancia] ${ev.texto}`);
                if (ev.salud) player.health += ev.salud;
                if (ev.felicidad) player.happiness += ev.felicidad;
                if (ev.dinero) player.money += ev.dinero;
            }
        }

        // 4. Motor del tiempo
        function nextYear() {
            player.age++;
            
            if (player.age < 16) {
                addLog(`Cumples ${player.age} años en Sevilla.`);
                dispararEventoDecisionInfancia();
            } else {
                if (player.job !== "Desempleado") {
                    let trabajoActual = trabajosSevilla.find(t => t.title === player.job);
                    if (trabajoActual) {
                        player.money += trabajoActual.salary;
                        addLog(`Has cobrado tu nómina anual de ${trabajoActual.salary}€ currando de ${player.job}.`);
                    }
                }
                
                if (player.isStudying) {
                    if (player.job !== "Desempleado") {
                        player.happiness -= 10;
                        player.health -= 5;
                        addLog(`¡Estudiar y trabajar a la vez es durísimo! El estrés pasa factura.`);
                    } else {
                        player.happiness -= 3;
                        addLog(`Has avanzado un año en tus estudios superiores.`);
                    }
                }
            }
            
            // Comprobación de límites vitales
            if (player.health <= 0) {
                addLog(`Has fallecido debido a tu pésimo estado de salud.`);
                alert("¡FIN DEL JUEGO! Tu personaje ha muerto.");
                location.reload();
                return;
            }

            // Normalizar barras
            if (player.health > 100) player.health = 100;
            if (player.happiness > 100) player.happiness = 100;
            if (player.happiness < 0) player.happiness = 0;
            if (player.health < 0) player.health = 0;
            if (player.money < 0) player.money = 0;
            
            updateUI();
        }

        function buscarTrabajo() {
            if (player.age < 16) return;
            let trabajosDisponibles = trabajosSevilla.filter(t => {
                if (player.educationLevel === "Universidad") return true;
                if (player.educationLevel === "FP") return t.reqEducation === "ESO" || t.reqEducation === "FP";
                return t.reqEducation === "ESO";
            });

            let trabajoElegido = trabajosDisponibles[Math.floor(Math.random() * trabajosDisponibles.length)];
            player.job = trabajoElegido.title;
            addLog(`¡Nuevo empleo! Ahora trabajas como: ${player.job}.`);
            updateUI();
        }

        function estudiar() {
            if (player.age < 6) return;
            player.isStudying = !player.isStudying;
            addLog(player.isStudying ? "Te has puesto las pilas con los libros." : "Has dejado los libros a un lado.");
            updateUI();
        }

        updateUI();
        addLog("Has nacido en Sevilla. Comienza tu aventura con 0 años.");
    </script>
</body>
</html>
