<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SevillaLife - Simulador</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 50px;
        }
        .game-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            color: #d9534f;
        }
        button {
            background-color: #f0ad4e;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #ec971f;
        }
        footer {
            margin-top: 40px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>SevillaLife</h1>
        <p>¡Bienvenido al simulador! Sobrevive al día a día sevillano.</p>
        <div id="stats">
            <p>Estado: Listo para comenzar</p>
        </div>
        <button onclick="jugar()">Avanzar Turno</button>
    </div>

    <footer>
        <p>&copy; 2026 AlberoLevels. Todos los derechos reservados.</p>
    </footer>

    <script>
        function jugar() {
            document.getElementById('stats').innerHTML = "<p>¡Un día más superado en Sevilla!</p>";
        }
    </script>

</body>
</html>
