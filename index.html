<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sevillalife</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #2c3e50; display: flex; justify-content: center; align-items: center; min-height: 100dvh; margin: 0; overflow: hidden; }
        
        #game-container { 
            width: 100%; max-width: 440px; background-color: #FDFBF7; 
            display: flex; flex-direction: column; height: 100dvh; position: relative; overflow: hidden;
        }
        
        #start-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: #FDFBF7; z-index: 100; padding: 16px;
            display: flex; flex-direction: column; justify-content: center; overflow-y: auto;
        }
        .form-card { 
            background: white; padding: 16px; border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); border-top: 5px solid #E5A54A; 
        }
        h1 { color: #C0392B; font-family: 'Montserrat', sans-serif; font-size: 1.6em; font-weight: 800; margin-bottom: 2px; text-align: center; }
        .subtitle { font-size: 0.75em; color: #555; text-align: center; margin-bottom: 2px; line-height: 1.2; }
        .note { font-size: 0.7em; color: #888; text-align: center; font-style: italic; margin-bottom: 10px; }
        
        label { display: block; margin-top: 8px; font-weight: 600; font-size: 0.75em; color: #2c3e50; }
        input, .select-trigger { width: 100%; padding: 8px; margin-top: 3px; border: 2px solid #ecf0f1; border-radius: 8px; font-size: 0.85em; outline: none; background: #fff; cursor: pointer; text-align: left; color: #2c3e50; }
        .select-trigger { display: flex; justify-content: space-between; align-items: center; }
        
        .start-btn { width: 100%; margin-top: 14px; padding: 10px; background: #C0392B; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .reset-btn { background: #fff; color: #c0392b; border: 2px solid #e74c3c; padding: 8px; border-radius: 8px; font-size: 0.8em; font-weight: 700; cursor: pointer; text-align: center; width: 100%; }
        
        header { background: #ffffff; padding: 10px 12px; text-align: center; border-top: 5px solid #E5A54A; flex-shrink: 0; }
        #player-name { font-family: 'Montserrat', sans-serif; font-size: 1.1em; font-weight: 800; color: #C0392B; margin-bottom: 4px; }
        
        .info-badges { display: flex; justify-content: center; gap: 6px; margin-bottom: 6px; }
        .badge { background: #fdf8f0; border: 1px solid #f3e5d0; padding: 4px 8px; border-radius: 6px; font-size: 0.7em; font-weight: 600; color: #555; }
        
        .stats { display: flex; justify-content: center; gap: 6px; font-size: 0.75em; font-weight: 600; background: #fdf8f0; padding: 6px; border-radius: 6px; border: 1px solid #f3e5d0; }
        
        #event-log { flex-grow: 1; padding: 10px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .log-entry { background: white; padding: 8px 10px; border-radius: 10px; font-size: 0.8em; border-left: 3px solid #E5A54A; }
        
        #actions-panel { padding: 10px 12px; background: white; border-top: 1px solid #eee; display: flex; flex-direction: column; gap: 6px; }
        .action-row { display: flex; gap: 6px; }
        .action-btn { flex: 1; padding: 10px; background: #C0392B; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 0.8em; cursor: pointer; text-align: center; }
        
        .footer-text { text-align: center; font-size: 0.65em; color: #888; padding: 4px 0; background: white; }

        #custom-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44, 62, 80, 0.7); z-index: 200; display: none; justify-content: center; align-items: center; padding: 20px; }
        .modal-card { background: white; width: 100%; max-width: 360px; max-height: 85vh; padding: 18px; border-radius: 16px; border-top: 5px solid #E5A54A; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
        .modal-scrollable-content { width: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-top: 10px; padding-right: 2px; }
    </style>
</head>
<body>
    <div id="game-container">
        <input type="file" id="file-selector" accept=".json" style="display: none;" onchange="handleFileLoad(event)">

        <div id="start-screen">
            <div class="form-card">
                <h1>Sevillalife</h1>
                <div class="subtitle">Registro oficial de identidad y alta en el padrón municipal.</div>
                <div class="note">* Nota: No es obligatorio introducir tus datos reales.</div>

                <label>Nombre</label><input type="text" id="name-input" maxlength="15" placeholder="Ej: Francisco">
                <label>Primer Apellido</label><input type="text" id="surname1-input" maxlength="15" placeholder="Ej: Pérez">
                <label>Segundo Apellido</label><input type="text" id="surname2-input" maxlength="15" placeholder="Ej: Gómez">
                
                <label>Zona / Distrito de nacimiento</label>
                <div class="select-trigger" onclick="openNeighborhoodModal()">
                    <span id="selected-neighborhood-text">Casco Antiguo</span>
                    <span style="font-size: 0.7em; color: #888;">▼</span>
                </div>

                <button class="start-btn" onclick="startGame()">Comenzar mi historia</button>
                <button class="reset-btn" style="margin-top:8px;" onclick="openManagerModal()">Gestión de Partida</button>
            </div>
        </div>

        <header>
            <div id="player-name">---</div>
            <div class="info-badges">
                <div class="badge">Edad: <span id="age-val">0</span> años</div>
                <div class="badge">DNI: <span id="dni-val">---</span></div>
            </div>
            <div class="info-badges">
                <div class="badge">📚 <span id="studies-val">Ninguno (Bebé)</span></div>
                <div class="badge">💼 <span id="job-val">En paro</span></div>
            </div>
            <div class="stats">
                <div>❤️ Salud: <span id="health-val">100</span>%</div>
                <div>😊 Felicidad: <span id="happiness-val">100</span>%</div>
            </div>
        </header>

        <main id="event-log"></main>

        <div id="actions-panel">
            <div class="action-row">
                <button class="action-btn" onclick="nextYear()">Cumplir año</button>
                <button class="action-btn" onclick="openStudyModal()">Estudiar</button>
            </div>
            <button class="action-btn" onclick="openJobModal()" style="width: 100%;">Buscar trabajo</button>
            <button class="reset-btn" onclick="openManagerModal()">Gestión de Partida</button>
            <button class="reset-btn" onclick="confirmResetGame()">Reiniciar partida</button>
            <div class="footer-text">© 2026 Frank. Todos los derechos reservados.</div>
        </div>

        <div id="custom-modal">
            <div class="modal-card">
                <div id="modal-title-text" style="font-weight:800; color:#C0392B; text-align:center; margin-bottom:5px;">Aviso</div>
                <div id="modal-msg-text" style="font-size:0.8em; text-align:center;"></div>
                <div id="modal-buttons-container" style="display:flex; flex-direction:column; gap:6px; width:100%; align-items:center; margin-top:10px;"></div>
            </div>
        </div>
    </div>
    
    <script>
        const defaultPlayerTemplate = { 
            name: "", dni: "", age: 0, health: 100, happiness: 100, money: 0, 
            salary: 0, studies: "Ninguno (Bebé)", job: "En paro", neighborhood: "Casco Antiguo", logs: [] 
        };
        let player = JSON.parse(JSON.stringify(defaultPlayerTemplate));
        let selectedNeighborhoodTemp = "Casco Antiguo";
        
        const districts = [ 
            { name: "Casco Antiguo", info: "Coste alto (-100€), +Felicidad" }, 
            { name: "Macarena", info: "Barrio equilibrado" }, 
            { name: "Nervión", info: "Nivel alto, mayores gastos (-200€)" }, 
            { name: "Triana", info: "Ambiente tradicional, +Felicidad" }, 
            { name: "Sur", info: "Cerca del parque, +Salud" }, 
            { name: "Los Remedios", info: "Poder adquisitivo, mayores gastos (-200€)" }, 
            { name: "Cerro-Amate", info: "Economía local, +Ahorro (+50€)" }, 
            { name: "Este-Alcosa-Torreblanca", info: "Residencial tranquilo, +Felicidad" }, 
            { name: "San Pablo-Santa Justa", info: "Bien conectado, +Inteligencia" }, 
            { name: "Norte", info: "Barrio obrero, +Ahorro (+50€)" }, 
            { name: "Bellavista-La Palmera", info: "Zona tranquila, +Salud" }
        ];

        function saveGame() { localStorage.setItem('sevillalife_save', JSON.stringify(player)); }
        
        function openNeighborhoodModal() { 
            const modal = document.getElementById('custom-modal'); 
            document.getElementById('modal-title-text').innerText = "Selecciona Distrito"; 
            document.getElementById('modal-msg-text').innerText = "Elige tu zona de nacimiento:"; 
            let listHTML = `<div class="modal-scrollable-content">`; 
            districts.forEach(d => { 
                let isSelected = selectedNeighborhoodTemp === d.name; 
                let bgStyle = isSelected ? "background: #fdf8f0; border: 2px solid #E5A54A;" : "background: #fff; border: 2px solid #ecf0f1;"; 
                listHTML += `<button class="action-btn" style="${bgStyle} color: #2c3e50; text-align: left; padding: 8px; display:flex; flex-direction:column;" onclick="selectNeighborhood('${d.name}')"><span style="font-weight:bold;">${d.name}</span><span style="font-size:0.7em; color:#888;">${d.info}</span></button>`; 
            }); 
            listHTML += `</div><button class="reset-btn" style="margin-top:10px;" onclick="document.getElementById('custom-modal').style.display='none'">Cerrar</button>`; 
            document.getElementById('modal-buttons-container').innerHTML = listHTML; 
            modal.style.display = 'flex'; 
        }

        function selectNeighborhood(d) { 
            selectedNeighborhoodTemp = d; 
            document.getElementById('selected-neighborhood-text').innerText = d; 
            document.getElementById('custom-modal').style.display = 'none'; 
        }

        function openManagerModal() { 
            const modal = document.getElementById('custom-modal'); 
            document.getElementById('modal-title-text').innerText = "Gestión de Partida"; 
            document.getElementById('modal-msg-text').innerText = "¿Guardar o cargar tu partida JSON?"; 
            document.getElementById('modal-buttons-container').innerHTML = `<button class="action-btn" onclick="exportData()">Guardar archivo</button><button class="action-btn" onclick="document.getElementById('file-selector').click(); document.getElementById('custom-modal').style.display='none'">Cargar archivo</button><button class="reset-btn" style="margin-top:4px;" onclick="document.getElementById('custom-modal').style.display='none'">Cerrar</button>`; 
            modal.style.display = 'flex'; 
        }

        function exportData() { 
            let dataStr = "data:application/json;charset=utf-8," + encodeURIComponent(JSON.stringify(player, null, 4)); 
            let dl = document.createElement('a'); 
            dl.setAttribute("href", dataStr); 
            dl.setAttribute("download", `sevillalife_${player.name.replace(/\s+/g, '_')}.json`); 
            dl.click(); 
        }

        function handleFileLoad(event) { 
            let reader = new FileReader(); 
            reader.onload = function(e) { 
                try { 
                    player = JSON.parse(e.target.result); 
                    saveGame(); 
                    location.reload(); 
                } catch(err) { alert("Error al leer el archivo."); } 
            }; 
            reader.readAsText(event.target.files[0]); 
        }

        function startGame() { 
            let n = document.getElementById('name-input').value.trim(); 
            let s1 = document.getElementById('surname1-input').value.trim(); 
            let s2 = document.getElementById('surname2-input').value.trim(); 
            if(!n || !s1 || !s2) return; 
            player.name = `${n} ${s1} ${s2}`; 
            player.dni = Math.floor(Math.random() * 90000000) + 10000000 + "S"; 
            player.neighborhood = selectedNeighborhoodTemp; 
            player.logs = [`Has nacido en ${player.neighborhood}, Sevilla. ¡Bienvenido al mundo! Tus padres te pasean en carrito por el Parque de María Luisa.`]; 
            saveGame(); 
            location.reload(); 
        }

        function nextYear() { 
            player.age++; 
            player.logs.push(`Has cumplido ${player.age} años.`);
            saveGame(); 
            updateUI(); 
            renderLogs(); 
        }

        function openStudyModal() {
            alert("Acción de estudiar en desarrollo.");
        }

        function openJobModal() {
            alert("Acción de buscar trabajo en desarrollo.");
        }

        function updateUI() { 
            document.getElementById('player-name').innerText = player.name; 
            document.getElementById('age-val').innerText = player.age;
            document.getElementById('dni-val').innerText = player.dni;
            document.getElementById('studies-val').innerText = player.studies;
            document.getElementById('job-val').innerText = player.job;
            document.getElementById('health-val').innerText = player.health; 
            document.getElementById('happiness-val').innerText = player.happiness; 
        }

        function renderLogs() { 
            const log = document.getElementById('event-log'); 
            log.innerHTML = ""; 
            player.logs.forEach(msg => { 
                const div = document.createElement('div'); 
                div.className = 'log-entry'; 
                div.innerText = msg; 
                log.appendChild(div); 
            }); 
            log.scrollTop = log.scrollHeight; 
        }

        function confirmResetGame() { 
            localStorage.removeItem('sevillalife_save'); 
            location.reload(); 
        }

        window.onload = () => { 
            let s = localStorage.getItem('sevillalife_save'); 
            if (s) { 
                player = JSON.parse(s); 
                document.getElementById('start-screen').style.display = 'none'; 
                updateUI(); 
                renderLogs(); 
            } 
        };
    </script>
</body>
</html>
